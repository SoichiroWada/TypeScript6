<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Edit Pizza</title>
  </head>

  <body>
    <nav>
      <h1>Edit Pizza</h1>
      <a href="/" class="btn">Back to Menu</a>
    </nav>

    <main class="wrap">
      <form class="edit">
        <label>
          <span>Title:</span>
          <input type="text" name="title" required />
        </label>

        <label>
          <span>Description:</span>
          <textarea name="description" required></textarea>
        </label>

        <fieldset>
          <legend>Choose toppings:</legend>

          <label>
            <input type="checkbox" name="toppings" value="mushrooms" />
            <span>mushrooms</span>
          </label>

          <label>
            <input type="checkbox" name="toppings" value="peppers" />
            <span>peppers</span>
          </label>

          <label>
            <input type="checkbox" name="toppings" value="sweetcorn" />
            <span>sweetcorn</span>
          </label>

          <label>
            <input type="checkbox" name="toppings" value="olives" />
            <span>olives</span>
          </label>

          <label>
            <input type="checkbox" name="toppings" value="pineapple" />
            <span>pineapple</span>
          </label>
        </fieldset>

        <label>
          <span>Price:</span>
          <input type="number" name="price" required />
        </label>

        <button>Save Changes</button>
      </form>
    </main>

    <script src="./ts/pizza_edit.ts" type="module"></script>
  </body>
</html>
